(function gen(){
  for(let x=0;x<WW;x++){
    const h=Math.floor(30+n1(x/20)*14+n2(x/6)*4);hs[x]=h;
    for(let y=h;y<WH;y++){
      const d=y-h;let id=d==0?1:d<4?2:3;
      if(h>40&&d<3)id=6;
      if(id==3){
        const c=Math.sin(x*.21+ph+Math.sin(y*.17)*2)+Math.sin(y*.23+Math.cos(x*.13)*2);
        if(d>6&&c>1.5)continue;
        const r=R();if(d>48&&r<.01)id=27;else if(d>35&&r<.02)id=26;else if(d>18&&r<.035)id=8;else if(d>4&&r<.05)id=7;else if(d>3&&Math.sin(x*.3+y*.4+ph)>.94)id=25;
      }
      if(y==WH-1||(y==WH-2&&R()<.5))id=9;
      set(x,y,id);
    }
  }
  // растительность
  for(let x=1;x<WW-1;x++){
    if(get(x,hs[x])!=1)continue;
    const r=R(),y=hs[x]-1;
    if(r<.05)setb(x,y,21);else if(r<.09)setb(x,y,22);else if(r<.13)setb(x,y,23);else if(r<.6)setb(x,y,20);
  }
  // деревья (фоновый слой)
  let last=-9;
  for(let x=4;x<WW-4;x++){
    if(get(x,hs[x])==1&&R()<.14&&x-last>3){
      last=x;const th=4+Math.floor(R()*4),top=hs[x]-th,rad=2+(th>5?1:0);
      for(let dx=-rad;dx<=rad;dx++)for(let dy=-rad;dy<=1;dy++)
        if(dx*dx+dy*dy*1.2<=rad*rad+1&&!get(x+dx,top+dy))setb(x+dx,top+dy,5);
      for(let y=hs[x]-1;y>=top;y--)setb(x,y,4);
    }
